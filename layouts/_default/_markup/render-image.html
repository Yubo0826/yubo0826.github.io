{{ $url := .Destination }}
{{ $remote := resources.GetRemote $url }}
{{ if $remote }}
  <img src="{{ $remote.RelPermalink }}" width="{{ $remote.Width }}" height="{{ $remote.Height }}"
    {{- with $.Text }} alt="{{ . }}"{{ end -}}
    {{- with $.Title }} title="{{ . }}"{{ end -}}
    style="width: auto;height: auto;">
{{ else }}
  {{ warnf  "Failed to download image %s" $url }}
{{ end }}
